name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Verify test naming convention
        run: |
          violations=$(find web/scripts -name '*.test.js' ! -name '_*.test.js' || true)
          if [ -n "$violations" ]; then
            echo "ERROR: test files must be prefixed with _ to be excluded from go:embed"
            echo "$violations"
            exit 1
          fi

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Lint Frontend
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # ebiten's internal/ui package eagerly initializes GLFW/X11 at package-import time (not
      # lazily), which panics on a headless runner with no DISPLAY - even for internal/overlay's
      # own tests, none of which open a real window. xvfb-run gives it a fake one to talk to.
      - name: Test Go
        run: xvfb-run -a go test ./...

      - name: Test Frontend
        run: npm test

  lint-and-test:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "lint + test succeeded"

  # Dev-build artifacts for every push to main (not PRs): lets anyone grab a fresh
  # Linux/Windows binary from the Actions run without waiting for a tagged release.
  # Unlike release.yml, this never creates a tag or a GitHub Release.
  build:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - uses: docker/setup-buildx-action@v4

      - name: Build dev artifacts
        run: make all-in-one VERSION=dev-${GITHUB_SHA::7} DOCKER_BUILD_ARGS="--cache-from type=gha --cache-to type=gha,mode=max"

      - uses: actions/upload-artifact@v7
        with:
          name: dev-build-${{ github.sha }}
          path: dist/
          retention-days: 14
