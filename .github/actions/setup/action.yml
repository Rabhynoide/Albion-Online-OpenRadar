name: Setup OpenRadar toolchain
description: >-
  Go, Node (LTS), libpcap, npm deps. Does NOT check out the repo - callers must do that
  themselves first (required anyway for a local composite action to resolve at all, so a
  second checkout in here would just be a redundant duplicate clone).

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: true

    - uses: actions/setup-node@v6
      with:
        node-version: "lts/*"
        cache: "npm"

    # libpcap for internal/capture; the rest for the two GUI toolkits pulled in by
    # cmd/radar (ebiten, for -overlay) and cmd/radar-settings (Fyne) - both are Windows-only
    # products (see docs/technical/NATIVE_*_CLIENT.md), but `go build ./...`/`go vet ./...`/
    # golangci-lint still fully typecheck every package for the host GOOS regardless of what
    # actually ships for that OS, and both toolkits' cgo bindings fail to import at all without
    # their native dev headers present - not a lint config issue, a missing system package one.
    - name: Install libpcap + ebiten/Fyne native deps (CGO, Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y \
          libpcap-dev \
          gcc pkg-config \
          libgl1-mesa-dev libglu1-mesa-dev \
          xorg-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
          libasound2-dev \
          libwayland-dev libxkbcommon-dev

    - name: Install npm dependencies
      shell: bash
      run: npm ci
