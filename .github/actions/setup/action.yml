name: Setup OpenRadar toolchain
description: >-
  Go, Node (LTS), libpcap, npm deps. Does NOT check out the repo - callers must do that
  themselves first (required anyway for a local composite action to resolve at all, so a
  second checkout in here would just be a redundant duplicate clone).

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: true

    - uses: actions/setup-node@v6
      with:
        node-version: "lts/*"
        cache: "npm"

    - name: Install libpcap (CGO, Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: Install npm dependencies
      shell: bash
      run: npm ci
